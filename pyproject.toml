[project]
name = "brocantor"
version = "0.1.0"
description = "Pipeline personnel de mise en vente sur Leboncoin (POC, usage local)"
requires-python = ">=3.12"

# Bornes basses = les versions réellement testées ; uv.lock fige les versions
# exactes. Ajouter une dépendance = la justifier dans le commit (cf. CLAUDE.md).
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.2",
    "pillow>=12.3.0",
    "litellm>=1.93.0",
]

[tool.uv]
# POC : pas de suite de tests, donc aucune dépendance de dev pour l'instant.
package = false
